<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="指紋測試">
<title>指紋測試</title>
<style>
 body{font:16px -apple-system,system-ui,sans-serif;margin:16px;background:#fff;color:#111}
 button{display:block;width:100%;font-size:17px;padding:12px;margin:10px 0;border-radius:10px;border:1px solid #888;background:#f3f3f3;color:inherit}
 pre{white-space:pre-wrap;word-break:break-all;background:#f6f6f6;padding:10px;border-radius:8px;font-size:13px}
 @media (prefers-color-scheme:dark){body{background:#111;color:#eee}button{background:#222}pre{background:#1d1d1d}}
</style></head><body>
<h3>Face ID / 指紋登入測試（不含病人資料）</h3>
<p style="font-size:14px">依序按 1 → 2 → 3 → 4。每一步都會跳出 Face ID 或指紋，請確認。</p>
<button id="b1">1. 建立測試用 passkey</button>
<button id="b2">2. 用 Face ID 取出金鑰（第一次）</button>
<button id="b3">3. 再取一次（應該和第 2 步相同）</button>
<button id="b4">4. 測試金鑰交換功能（不需 Face ID）</button>
<button id="b5">5. 刪除這頁存的測試紀錄</button>
<pre id="o">結果會顯示在這裡</pre>
<script>
// Throwaway probe: does this iPhone support WebAuthn passkeys with the PRF extension
// (a stable secret released only after Face ID / Touch ID), in Safari and in home-screen mode?
// Only short fingerprints (first 8 hex of SHA-256) of the secret are shown; nothing leaves the phone.
const o = document.getElementById('o');
const log = m => { o.textContent = new Date().toLocaleTimeString() + '  ' + m + '\n' + o.textContent; };
const enc = new TextEncoder();
const SALT = enc.encode('oncall-prf-probe-v1').buffer;
const hex = b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
const fp = async b => hex(await crypto.subtle.digest('SHA-256', b)).slice(0, 8);
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const b64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
const getId = () => { try { return localStorage.getItem('probeCredId'); } catch (e) { return null; } };
const setId = v => { try { localStorage.setItem('probeCredId', v); } catch (e) {} };

log('環境：主畫面模式=' + (navigator.standalone === true) + '，WebAuthn=' + (!!window.PublicKeyCredential) +
    '，已存測試紀錄=' + (!!getId()) + '\n' + navigator.userAgent);

document.getElementById('b1').onclick = async () => {
  try {
    const cred = await navigator.credentials.create({ publicKey: {
      rp: { name: '值班測試', id: location.hostname },
      user: { id: rnd(16), name: 'prf-probe', displayName: '值班測試' },
      challenge: rnd(32),
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { residentKey: 'required', userVerification: 'required', authenticatorAttachment: 'platform' },
      extensions: { prf: { eval: { first: SALT } } }
    }});
    setId(b64u(cred.rawId));
    const ext = cred.getClientExtensionResults();
    const prf = ext && ext.prf;
    let extra = '';
    if (prf && prf.results && prf.results.first) extra = '，建立時已取得金鑰 指紋=' + await fp(prf.results.first);
    log('1 成功：passkey 已建立。PRF 支援=' + (prf ? String(prf.enabled) : '未回報') + extra);
  } catch (e) { log('1 失敗：' + e.name + ' ' + e.message); }
};

async function getPrf(step) {
  try {
    const id = getId();
    const opts = { challenge: rnd(32), rpId: location.hostname, userVerification: 'required',
                   extensions: { prf: { eval: { first: SALT } } } };
    if (id) opts.allowCredentials = [{ type: 'public-key', id: unb64u(id) }];
    const a = await navigator.credentials.get({ publicKey: opts });
    const prf = a.getClientExtensionResults().prf;
    if (!prf || !prf.results || !prf.results.first) { log(step + ' 驗證成功，但沒有取得金鑰（PRF 不支援）'); return; }
    const out = prf.results.first;
    window.__lastPrf = out;
    log(step + ' 成功：取得金鑰 長度=' + out.byteLength + ' bytes，指紋=' + await fp(out));
  } catch (e) { log(step + ' 失敗：' + e.name + ' ' + e.message); }
}
document.getElementById('b2').onclick = () => getPrf('2');
document.getElementById('b3').onclick = () => getPrf('3');

document.getElementById('b4').onclick = async () => {
  // Can WebCrypto do X25519 (needed so the phone can give the hospital PC a PUBLIC key only)?
  try {
    const kp = await crypto.subtle.generateKey({ name: 'X25519' }, true, ['deriveBits']);
    const kp2 = await crypto.subtle.generateKey({ name: 'X25519' }, true, ['deriveBits']);
    const s1 = await crypto.subtle.deriveBits({ name: 'X25519', public: kp2.publicKey }, kp.privateKey, 256);
    const s2 = await crypto.subtle.deriveBits({ name: 'X25519', public: kp.publicKey }, kp2.privateKey, 256);
    let fromSeed = '未測（先做第 2 步）';
    if (window.__lastPrf) {
      const pkcs8 = new Uint8Array([0x30,0x2e,0x02,0x01,0x00,0x30,0x05,0x06,0x03,0x2b,0x65,0x6e,0x04,0x22,0x04,0x20, ...new Uint8Array(window.__lastPrf).slice(0, 32)]);
      const priv = await crypto.subtle.importKey('pkcs8', pkcs8, { name: 'X25519' }, true, ['deriveBits']);
      const jwk = await crypto.subtle.exportKey('jwk', priv);
      fromSeed = jwk.x ? '可以（公鑰指紋=' + (await fp(unb64u(jwk.x))) + '）' : '匯出沒有公鑰';
    }
    log('4 X25519：' + (hex(s1) === hex(s2) ? '支援' : '結果不一致') + '；由金鑰產生公鑰：' + fromSeed);
  } catch (e) { log('4 X25519 不支援：' + e.name + ' ' + e.message + '（之後可改用內建程式碼，不影響）'); }
};

document.getElementById('b5').onclick = () => {
  try { localStorage.removeItem('probeCredId'); } catch (e) {}
  log('5 已刪除本頁紀錄。iPhone 鑰匙圈裡的測試 passkey 可到 設定 → 密碼 搜尋「github.io」刪除。');
};
</script>
</body></html>
