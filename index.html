<!doctype html>
<html lang="zh-Hant"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com/macros/s/AKfycbxB17H_wYc88dGZaUi4pmkQKnI7ETcGBDDoR7STCmdBY_oTIY2-MzmLHbl-WWRADZo05A/exec https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="值班">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#D65A52">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png">
<title>值班</title>
<style>
/* layout + colours ported as-is from booklet_app.TEMPLATE; PWA-only additions are marked "pwa" */
:root{--bg:#f6f6f4;--card:#fff;--ink:#1d1d1b;--sub:#6b6b66;--line:#e2e2dd;--acc:#8E3B46;--accbg:#F3DADD;--tag:#3F3F3F;--new:#EAD9A6;--newink:#4a3a10;--tp:#b81c1c;--hr:#1a33bf;--rr:#198033;--grid:#d6d6d0}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--ink:#ecece8;--sub:#9a9a93;--line:#34342f;--acc:#d9808c;--accbg:#3a2226;--tag:#5a5a55;--new:#5b4c1e;--newink:#f1e2b0;--tp:#ff6b6b;--hr:#7f95ff;--rr:#5fd07e;--grid:#3a3a35}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
.mk{font-weight:700;text-decoration:underline;text-underline-offset:2px}
.sub{color:var(--sub)}
#list{padding-bottom:40px}
/* pwa: setup / pending / login panes share the old login look */
.pane{max-width:340px;margin:0 auto;padding:calc(12vh) 20px 20px}
.pane h2{margin:0 0 4px;font-size:22px}
.pane h3{margin:18px 0 2px;font-size:15px}
.pane input{width:100%;padding:12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:16px}
.pane button{width:100%;padding:12px;margin-top:8px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font:inherit;font-size:16px}
.pane button.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.pane button:disabled{opacity:.5}
.pane form + form{margin-top:10px;padding-top:6px;border-top:1px solid var(--line)}
.msg{margin-top:10px;min-height:20px;color:var(--acc);font-size:14px;overflow-wrap:anywhere}
.code{font-size:40px;font-weight:700;letter-spacing:.18em;text-align:center;margin:14px 0 4px;font-variant-numeric:tabular-nums}
#foot{max-width:340px;margin:0 auto;padding:30px 20px calc(20px + env(safe-area-inset-bottom));text-align:center}
.lo{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:2px 8px;font:12px inherit;font-family:inherit}
#foot .lo{padding:6px 12px;color:var(--sub)}
.hid #list,.hid #detail{visibility:hidden}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.top h1 small{font-weight:400;color:var(--sub);font-size:12px}
.seg{display:flex;gap:6px;margin-bottom:6px}
.seg button{flex:1;padding:8px 4px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=search]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:13px inherit;font-family:inherit}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{display:block;width:calc(100% - 24px);margin:8px 12px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:left;color:inherit;font:inherit}
.card .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bed{font-weight:700;font-size:17px}
.id{color:var(--sub);font-size:12px}
.badge{display:inline-block;padding:1px 7px;border-radius:6px;font-size:12px;font-weight:700;color:#fff;background:var(--tag)}
.badge.new{background:var(--new);color:var(--newink)}
.badge.mk2{background:var(--accbg);color:var(--acc);text-decoration:underline}
.card .r2{margin-top:4px;font-size:13px}
.empty{padding:40px 12px;text-align:center;color:var(--sub)}
.sec-h{margin:14px 12px 4px;font-size:12px;color:var(--sub);letter-spacing:.04em}
#detail{display:none;position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:10;-webkit-overflow-scrolling:touch}
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit}
.bar .t{flex:1;text-align:center;font-weight:700}
.body{padding:10px 12px 60px;max-width:640px;margin:0 auto}
.hd .bed{font-size:22px}.hd .nm{font-size:20px;font-weight:700;margin-left:6px}
.meta{color:var(--sub);font-size:13px;margin:2px 0 8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.box h3{margin:0 0 6px;font-size:13px;color:var(--sub);font-weight:600}
details.box summary{cursor:pointer;font-size:13px;color:var(--sub);font-weight:600;list-style:none}
details.box summary::before{content:"▸ "}details[open].box summary::before{content:"▾ "}
details.box[open] summary{margin-bottom:6px}
.labs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px}
.labs.c4{grid-template-columns:repeat(4,1fr)}
.sub2{font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 4px;padding-top:6px;border-top:1px solid var(--line)}
.sub2:first-of-type{border-top:0;padding-top:0;margin-top:0}
.lab{font-size:12px;color:var(--sub)}.lab b{display:block;font-size:17px;color:var(--ink);font-weight:600}
.lab b.mk{font-weight:800}
svg{width:100%;height:auto;display:block;touch-action:pan-y}
#read{font-size:12.5px;min-height:18px;color:var(--ink);margin-top:4px}
.leg{font-size:12px;color:var(--sub);margin-top:4px}.leg i{font-style:normal;font-weight:700}
.row{margin:2px 0}.row .k{font-weight:700}
.row.k{font-weight:700;margin-top:6px}
.mg{display:grid;grid-template-columns:fit-content(46%) 1fr;gap:5px 14px;margin:3px 0 6px}
.mg .st{font-weight:600;overflow-wrap:anywhere}
ul.ml{margin:2px 0 4px;padding-left:20px}ul.ml li{margin:3px 0}
.med{margin:2px 0}.med .c{font-weight:700}
.memo{white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
/* pwa: data stamp / computer status / refresh / notices */
.sys{font-size:12px;color:var(--sub);margin:0 0 6px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.sys:empty{display:none}
.sys button{border:1px solid var(--acc);background:var(--card);color:var(--acc);border-radius:8px;padding:2px 10px;font:12px inherit;font-family:inherit}
.sys button:disabled{opacity:.5}
.banner{margin:0 0 6px;padding:6px 10px;border-radius:8px;background:var(--accbg);color:var(--acc);font-size:13px;font-weight:600;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--acc);overflow-wrap:anywhere}
#lsys{margin-top:14px}
#boot{padding:30vh 20px 20px;text-align:center;color:var(--sub)}
</style></head><body>
<div id="boot">載入中…</div>

<div id="setup" class="pane" style="display:none"><h2>值班手冊</h2><p class="sub">首次使用：請選擇登入方式</p>
<form id="sf" autocomplete="off"><h3>啟用 Face ID / 指紋</h3>
<input id="su" type="text" placeholder="帳號" autocomplete="username" autocapitalize="off" spellcheck="false" required>
<input id="sn" type="text" placeholder="顯示姓名（給管理者核對）" maxlength="20" required>
<button id="sb" type="submit">啟用 Face ID</button></form>
<form id="pf" autocomplete="on"><h3>使用備援密碼</h3>
<input id="pu" name="username" type="text" placeholder="帳號" autocomplete="username" autocapitalize="off" spellcheck="false" required>
<input id="pp" name="password" type="password" placeholder="通關句（5 個英文字）" autocomplete="current-password" autocapitalize="off" required>
<input id="pk" type="text" placeholder="存取碼" autocomplete="off" autocapitalize="off" spellcheck="false" required>
<button id="pb" type="submit">登入</button></form>
<div id="sm" class="msg"></div>
<button id="sx" type="button" style="display:none">再按一次 Face ID 完成登記</button></div>

<div id="pending" class="pane" style="display:none"><h2>等待核可</h2>
<p class="sub">請管理者在院內電腦核可，並核對這組確認碼：</p>
<div id="pcode" class="code"></div><div id="pacct" class="sub"></div>
<button id="pfin" type="button" style="display:none">完成啟用（Face ID）</button>
<button id="pchk" type="button" class="ghost">立即檢查</button>
<button id="pcan" type="button" class="ghost">取消登記</button>
<div id="pm" class="msg"></div></div>

<div id="login" class="pane" style="display:none"><h2>值班手冊</h2>
<div id="lx"><p class="sub">以 Face ID / 指紋開啟</p><button id="fx" type="button">Face ID 登入</button></div>
<form id="lf" autocomplete="on"><p class="sub">請輸入帳號與通關句</p>
<input id="lu" name="username" type="text" placeholder="帳號" autocomplete="username" autocapitalize="off" spellcheck="false" required>
<input id="lp" name="password" type="password" placeholder="通關句" autocomplete="current-password" autocapitalize="off" required>
<button id="lb" type="submit">登入</button></form>
<div id="lm" class="msg"></div>
<div id="lsys" class="sys"></div></div>

<div id="list" style="display:none">
  <div class="top">
    <h1><span>值班手冊</span><span><small id="stamp"></small> <button id="lo" class="lo">登出</button></span></h1>
    <div id="banner" class="banner" style="display:none"></div>
    <div id="sys" class="sys"></div>
    <div class="seg" id="zone"></div>
    <input type="search" id="q" placeholder="搜尋 床號 / 病歷號 / 姓名" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
  <div id="cards"></div>
</div>
<div id="detail">
  <div class="bar"><button id="back">← 清單</button><div class="t" id="dt"></div><button id="prev">▲</button><button id="next">▼</button></div>
  <div class="body" id="db"></div>
</div>
<div id="foot" style="display:none"><button id="clr" type="button" class="lo">清除本機資料</button></div>
<script src="config.js"></script>
<script src="crypto.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body></html>
