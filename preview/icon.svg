<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 值班 app icon: winged hourglass ("Kairos" — catch the moment). Original artwork. -->
  <rect width="1024" height="1024" fill="#D65A52"/>
  <defs>
    <g id="wing">
      <!-- feathers fan out to the left from the hourglass waist (origin at 0,0) -->
      <path d="M0,-40 C-90,-150 -250,-230 -380,-235 C-300,-170 -200,-110 -60,-30 Z" fill="#FFF6E6"/>
      <path d="M0,-10 C-110,-90 -270,-130 -400,-120 C-310,-70 -200,-30 -50,10 Z" fill="#FFF6E6"/>
      <path d="M0,20 C-110,-20 -250,-20 -360,10 C-270,40 -170,60 -40,45 Z" fill="#FFF6E6"/>
      <path d="M0,45 C-90,40 -200,70 -280,115 C-190,120 -110,105 -30,70 Z" fill="#FFF6E6"/>
      <!-- feather lines -->
      <path d="M-70,-60 C-160,-130 -260,-180 -330,-200" stroke="#E9C9A8" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M-70,-25 C-170,-70 -270,-100 -350,-110" stroke="#E9C9A8" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M-70,15 C-160,0 -240,5 -310,15" stroke="#E9C9A8" stroke-width="10" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <g transform="translate(512,520) scale(0.84) translate(-512,-520)">
  <!-- wings -->
  <use href="#wing" transform="translate(452,520)"/>
  <use href="#wing" transform="translate(572,520) scale(-1,1)"/>
  <!-- hourglass frame: top and bottom bars -->
  <rect x="352" y="232" width="320" height="44" rx="22" fill="#FFF6E6"/>
  <rect x="352" y="764" width="320" height="44" rx="22" fill="#FFF6E6"/>
  <!-- glass -->
  <path d="M392,276 L632,276 C632,380 560,450 530,520 C560,590 632,660 632,764 L392,764 C392,660 464,590 494,520 C464,450 392,380 392,276 Z"
        fill="#B8443D" stroke="#FFF6E6" stroke-width="22" stroke-linejoin="round"/>
  <!-- sand: remaining top, falling stream, pile bottom -->
  <path d="M432,330 L592,330 C580,400 540,450 512,500 C484,450 444,400 432,330 Z" fill="#F3D54A"/>
  <rect x="505" y="500" width="14" height="180" rx="7" fill="#F3D54A"/>
  <path d="M420,742 C440,680 480,650 512,640 C544,650 584,680 604,742 Z" fill="#F3D54A"/>
</g>
</svg>
